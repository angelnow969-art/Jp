let state={settings:{theme:'dark',font:1,tts:false},notes:[],tasks:[],projects:[],favorites:[],recent:[],custom:[],history:[],flash:0};
try{if(typeof BOOT_DATA==='object'&&BOOT_DATA)state={...state,...BOOT_DATA,settings:{...state.settings,...(BOOT_DATA.settings||{})}}}catch(e){}
let dbReady=false;
let idbInstance=null;
let saveTimer=null;
let searchTimer=null;
const built=APP.seed;
function notify(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.remove('show'),2500)}
function mergeState(incoming){if(!incoming||typeof incoming!=='object')return;state={...state,...incoming,settings:{...state.settings,...(incoming.settings||{})}};if(!Array.isArray(state.notes))state.notes=[];if(!Array.isArray(state.tasks))state.tasks=[];if(!Array.isArray(state.favorites))state.favorites=[];if(!Array.isArray(state.custom))state.custom=[];if(!Array.isArray(state.history))state.history=[];}
function saveLocalFallback(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){notify('Armazenamento local indisponível; use Exportar.')}}
async function idbOpen(){if(idbInstance)return idbInstance;if(!('indexedDB'in window))throw new Error('IndexedDB indisponível');idbInstance=await new Promise((res,rej)=>{const r=indexedDB.open('UltraLocalDB',5);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('apps'))db.createObjectStore('apps',{keyPath:'id'});if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Falha ao abrir banco'))});return idbInstance}
async function idbGet(){const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction('apps','readonly');const req=tx.objectStore('apps').get(KEY);req.onsuccess=()=>res(req.result?.state||null);req.onerror=()=>rej(req.error)})}
async function idbPut(){const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction('apps','readwrite');tx.objectStore('apps').put({id:KEY,state,updatedAt:Date.now(),schema:5});tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error||new Error('Falha ao salvar'))})}
function save(){saveLocalFallback();clearTimeout(saveTimer);saveTimer=setTimeout(()=>idbPut().catch(()=>{}),120);try{channel?.postMessage({type:'state-updated',key:KEY,at:Date.now()})}catch(e){}}
async function load(){let loaded=null;try{loaded=await idbGet()}catch(e){}if(!loaded){try{const raw=localStorage.getItem(KEY);if(raw)loaded=JSON.parse(raw)}catch(e){}}if(loaded)mergeState(loaded);dbReady=true;render()}
const channel=('BroadcastChannel'in window)?new BroadcastChannel('UltraLocalSync'):null;
if(channel){channel.addEventListener('message',async e=>{if(e.data?.type==='state-updated'&&e.data.key===KEY){try{const fresh=await idbGet();if(fresh){mergeState(fresh);render();notify('Dados sincronizados entre abas')}}catch(_){} }})}
function debouncedSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(currentView()==='knowledge')renderView('knowledge')},120)}
function setView(name){location.hash=name; $$('[data-view]').forEach(v=>v.classList.toggle('active',v.dataset.view===name)); $$('[data-nav]').forEach(v=>v.classList.toggle('active',v.dataset.nav===name)); renderView(name)}
function currentView(){return location.hash.replace('#','')||'home'}
function render(){setView(currentView()); applyTheme(); updateCounts();}
function applyTheme(){document.documentElement.dataset.theme=state.settings.theme;document.body.style.fontSize=(1+0.04*(state.settings.font-1))+'rem'}
function updateCounts(){$('#noteCount').textContent=state.notes.length;$('#taskCount').textContent=state.tasks.filter(t=>!t.done).length;$('#favCount').textContent=state.favorites.length;}
function renderView(name){const mount=$('#mount'); if(!mount)return; if(name==='home')return home(); if(name==='knowledge')return knowledge(); if(name==='tools')return tools(); if(name==='notes')return notes(); if(name==='tasks')return tasks(); if(name==='flash')return flash(); if(name==='directory')return directory(); if(name==='import')return importer(); if(name==='about')return about(); if(name==='prompt')return promptStudio(); home()}
function layout(title,desc,actions=''){return `<div class="hero"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${actions}</div></div>`}
function home(){
 const done=state.tasks.filter(t=>t.done).length, total=state.tasks.length, prog=total?Math.round(done/total*100):0;
 $('#mount').innerHTML=layout(APP.title,APP.subtitle,`<button class="primary" onclick="quickNote()">Nova captura</button><button onclick="exportSnapshot()">Exportar app</button>`)+`<div class="grid g4"><div class="card"><div class="muted">Conhecimentos</div><div class="kpi">${built.cards.length}</div><div class="tagrow"><span class="badge">embutidos</span><span class="badge">offline</span></div></div><div class="card"><div class="muted">Notas</div><div class="kpi" id="noteCount">${state.notes.length}</div><div class="muted">memória local</div></div><div class="card"><div class="muted">Tarefas abertas</div><div class="kpi" id="taskCount">${state.tasks.filter(t=>!t.done).length}</div><div class="progress"><span style="width:${prog}%"></span></div></div><div class="card"><div class="muted">Favoritos</div><div class="kpi" id="favCount">${state.favorites.length}</div><div class="muted">itens fixados</div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><h2>Mapa do sistema</h2><div class="list">${APP.modules.map(m=>`<div class="item" onclick="setView('${m.id}')"><div class="itemtitle">${m.icon} ${esc(m.title)}</div><div class="itemmeta">${esc(m.desc)}</div></div>`).join('')}</div></div><div class="card"><h2>Inicialização rápida</h2><div class="notice">${esc(APP.notice)}</div><div class="list" style="margin-top:10px">${APP.quick.map((q,i)=>`<div class="check"><input type="checkbox" onchange="toggleQuick(${i},this.checked)"><div><strong>${esc(q)}</strong><div class="itemmeta">microação sugerida</div></div></div>`).join('')}</div></div></div><div class="grid g3" style="margin-top:13px"><div class="card"><h3>Últimos registros</h3>${recentItems()}</div><div class="card"><h3>Fontes e atualizações</h3><div class="list">${APP.sources.slice(0,5).map(s=>`<div class="item"><strong>${esc(s.title)}</strong><div class="itemmeta">${esc(s.note)}</div></div>`).join('')}</div></div><div class="card"><h3>Modo local</h3><div class="muted">O arquivo funciona sem servidor externo. Alterações são mantidas localmente no navegador e também podem ser exportadas como snapshot.</div><button style="margin-top:9px" onclick="setView('about')">Como usar</button></div></div><div class="footer">Conteúdo embutido + dados locais. Para dados sensíveis, use anonimização e nunca inclua credenciais. Consulte fontes oficiais quando a informação puder mudar.</div>`;
}
function recentItems(){let arr=[...state.notes.map(n=>({d:n.created,type:'Nota',t:n.title||n.body.slice(0,40)})),...state.tasks.map(t=>({d:t.created,type:'Tarefa',t:t.title}))].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,8);return arr.length?`<div class="timeline">${arr.map(x=>`<div class="event"><strong>${esc(x.t)}</strong><div class="itemmeta">${esc(x.type)} · ${new Date(x.d).toLocaleString()}</div></div>`).join('')}</div>`:`<div class="empty">Ainda não há registros.</div>`}
function knowledge(){let q=($('#globalSearch')?.value||'').trim().toLowerCase();let data=[...built.cards,...state.custom];if(q)data=data.filter(x=>(x.title+' '+x.body+' '+x.category+' '+x.tags.join(' ')).toLowerCase().includes(q)); const cats=[...new Set(data.map(x=>x.category))].sort();$('#mount').innerHTML=layout('Conhecimento',`${data.length} itens disponíveis. Busca local, sem API externa.`, `<button onclick="setView('home')">Início</button><button class="primary" onclick="openCardEditor()">Adicionar conteúdo</button>`)+`<div class="toolbar"><select id="catFilter" onchange="renderKnowledgeFiltered()"><option value="">Todas as áreas</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="langFilter" onchange="renderKnowledgeFiltered()"><option value="">Todos os idiomas</option><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option><option value="it">IT</option><option value="ja">JA</option><option value="zh">ZH</option><option value="ar">AR</option><option value="ru">RU</option></select><span class="muted">Digite no campo superior para pesquisar.</span></div><div id="knowledgeGrid" class="grid g2">${data.slice(0,160).map(knowledgeCard).join('')}</div>`}
function knowledgeCard(x){const fav=state.favorites.includes(x.id);return `<article class="card"><div class="metricline"><span class="badge">${esc(x.category)}</span><span class="badge">${esc(x.level||'referência')}</span></div><h3>${esc(x.title)}</h3><div class="muted" style="line-height:1.6">${esc(x.body).replace(/\n/g,'<br>')}</div><div class="tagrow">${x.tags.slice(0,6).map(t=>`<span class="badge">#${esc(t)}</span>`).join('')}</div><div class="actions" style="margin-top:9px"><button onclick='speak(${JSON.stringify(x.title+". "+x.body)})'>Ouvir</button><button onclick='copyText(${JSON.stringify(x.body)})'>Copiar</button><button onclick='toggleFav(${JSON.stringify(x.id)})'>${fav?'★':'☆'}</button></div></article>`}
function renderKnowledgeFiltered(){const cat=$('#catFilter')?.value||'',lang=$('#langFilter')?.value||'',q=($('#globalSearch')?.value||'').toLowerCase();let data=[...built.cards,...state.custom].filter(x=>(!cat||x.category===cat)&&(!lang||x.lang===lang)&&(q?(x.title+' '+x.body+' '+x.tags.join(' ')).toLowerCase().includes(q):true));$('#knowledgeGrid').innerHTML=data.slice(0,200).map(knowledgeCard).join('')||`<div class="empty">Nenhum resultado.</div>`}
function notes(){ $('#mount').innerHTML=layout('Notas e memória','Capturas locais, organizadas por tags.','<button class="primary" onclick="quickNote()">Nova nota</button><button onclick="backupJSON()">Backup JSON</button>')+`<div class="grid g2"><div class="card"><h3>Nova nota</h3><div class="field"><label>Título</label><input id="noteTitle" placeholder="Ex.: ideia, estudo, projeto"></div><div class="field"><label>Conteúdo</label><textarea id="noteBody" placeholder="Escreva sem depender da internet..."></textarea></div><div class="field"><label>Tags</label><input id="noteTags" placeholder="ex.: música, estágio, estudo"></div><button class="primary" onclick="addNote()">Salvar nota</button></div><div class="card"><h3>Notas salvas</h3><div id="noteList" class="list">${state.notes.slice().reverse().map(noteRow).join('')||'<div class="empty">Nenhuma nota.</div>'}</div></div></div>`}
function noteRow(n){return `<div class="item"><div class="itemhead"><div><div class="itemtitle">${esc(n.title||'Sem título')}</div><div class="itemmeta">${new Date(n.created).toLocaleString()}</div></div><button class="danger" onclick="deleteNote('${n.id}')">Excluir</button></div><div style="margin-top:7px;white-space:pre-wrap;line-height:1.55">${esc(n.body)}</div><div class="tagrow">${(n.tags||[]).map(t=>`<span class="badge">#${esc(t)}</span>`).join('')}</div></div>`}
function addNote(){const title=$('#noteTitle').value.trim(),body=$('#noteBody').value.trim(),tags=$('#noteTags').value.split(',').map(x=>x.trim()).filter(Boolean);if(!body)return notify('Escreva algo antes de salvar.');state.notes.push({id:uid(),title,body,tags,created:now()});save();notify('Nota salva localmente.');notes();updateCounts()}
function deleteNote(id){state.notes=state.notes.filter(n=>n.id!==id);save();notes();updateCounts()}
function quickNote(){setView('notes');setTimeout(()=>$('#noteTitle')?.focus(),50)}
function tasks(){const open=state.tasks.filter(t=>!t.done), done=state.tasks.filter(t=>t.done);$('#mount').innerHTML=layout('Tarefas','Projetos quebrados em ações concretas.',`<button class="primary" onclick="addTask()">Adicionar tarefa</button>`)+`<div class="grid g2"><div class="card"><h3>Nova tarefa</h3><div class="field"><label>Título</label><input id="taskTitle" placeholder="Resultado desejado"></div><div class="field"><label>Área</label><input id="taskArea" placeholder="Música, estudo, estágio..."></div><button class="primary" onclick="addTask()">Salvar</button><div class="list" style="margin-top:12px">${open.map(taskRow).join('')||'<div class="empty">Tudo limpo.</div>'}</div></div><div class="card"><h3>Concluídas</h3><div class="list">${done.map(taskRow).join('')||'<div class="empty">Nenhuma ainda.</div>'}</div></div></div>`}
function addTask(){const t=$('#taskTitle')?.value?.trim();if(!t)return notify('Digite a tarefa.');state.tasks.push({id:uid(),title:t,area:$('#taskArea')?.value?.trim()||'',done:false,created:now()});save();tasks();updateCounts()}
function taskRow(t){return `<div class="item"><div class="check"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div><strong>${esc(t.title)}</strong><div class="itemmeta">${esc(t.area||'Sem área')} · ${new Date(t.created).toLocaleString()}</div></div></div></div>`}
function toggleTask(id,v){const t=state.tasks.find(x=>x.id===id);if(t)t.done=v;save();tasks();updateCounts()}
function flash(){let q=APP.questions[(state.flash||0)%APP.questions.length];$('#mount').innerHTML=layout('Flashcards','Recuperação ativa para estudar em ciclos curtos.',`<button onclick="nextFlash()">Próxima</button><button class="primary" onclick="$('#answer').classList.toggle('hide')">Revelar resposta</button>`)+`<div class="card"><div class="badge">${esc(APP.name)}</div><h2 style="margin-top:16px">${esc(q.q)}</h2><div id="answer" class="notice hide" style="margin-top:14px">${esc(q.a)}</div><div class="tagrow">${q.tags.map(t=>`<span class="badge">#${esc(t)}</span>`).join('')}</div></div><div class="card" style="margin-top:13px"><h3>Como usar</h3><div class="muted">Tente responder sem olhar. Depois revele, compare e registre o ponto que faltou. A próxima revisão pode virar uma tarefa.</div></div>`}
function nextFlash(){state.flash=(state.flash||0)+1;save();flash()}
function tools(){ $('#mount').innerHTML=layout('Ferramentas','Utilidades offline integradas ao próprio arquivo.')+`<div class="grid g3"><div class="card"><h3>Calculadora</h3><div class="field"><input id="calc" placeholder="(120/5)+7*2"></div><button class="primary" onclick="calcRun()">Calcular</button><div id="calcOut" class="notice" style="margin-top:9px">Resultado aqui.</div></div><div class="card"><h3>Pomodoro</h3><div class="kpi" id="timer">25:00</div><div class="actions"><button onclick="timerStart(25)">25 min</button><button onclick="timerStart(5)">5 min</button><button onclick="timerStop()">Parar</button></div></div><div class="card"><h3>Texto para voz</h3><div class="field"><textarea id="ttsText" placeholder="Cole um conteúdo curto para ouvir"></textarea></div><button class="primary" onclick="speak($('#ttsText').value)">Falar</button></div><div class="card"><h3>Conversão rápida</h3><div class="field"><label>Valor</label><input id="uVal" type="number" value="1"></div><div class="field"><select id="uMode"><option value="kg-g">kg → g</option><option value="g-kg">g → kg</option><option value="l-ml">L → mL</option><option value="ml-l">mL → L</option><option value="mg-g">mg → g</option><option value="g-mg">g → mg</option></select></div><button onclick="convertUnit()">Converter</button><div id="uOut" class="notice" style="margin-top:9px">—</div></div><div class="card"><h3>Gerador de prompt</h3><div class="field"><label>Objetivo</label><input id="pGoal" placeholder="Ex.: analisar um projeto"></div><div class="field"><label>Restrições</label><input id="pRules" placeholder="formato, limites, público"></div><button onclick="setView('prompt')">Abrir Prompt Studio</button></div><div class="card"><h3>Exportações</h3><div class="actions"><button onclick="backupJSON()">JSON</button><button onclick="exportMarkdown()">Markdown</button><button class="primary" onclick="exportSnapshot()">HTML snapshot</button></div></div></div>`}
let timerHandle=null,timerEnd=0;
function timerStart(min){timerStop();timerEnd=Date.now()+min*60000;timerHandle=setInterval(()=>{let s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('#timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;if(!s){timerStop();notify('Timer concluído.')}},250)}
function timerStop(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;$('#timer')?.textContent&&( $('#timer').textContent='25:00')}
function calcRun(){const v=$('#calc').value;try{if(!/^[0-9+\-*/().%\s]+$/.test(v))throw 0;$('#calcOut').textContent=String(Function('"use strict";return ('+v+')')())}catch(e){$('#calcOut').textContent='Expressão inválida.'}}
function convertUnit(){const n=Number($('#uVal').value),m=$('#uMode').value;const f={'kg-g':1000,'g-kg':.001,'l-ml':1000,'ml-l':.001,'mg-g':.001,'g-mg':1000}[m];$('#uOut').textContent=String(n*f)}
function directory(){let q=($('#globalSearch')?.value||'').toLowerCase();let d=APP.directory.filter(x=>(x.name+' '+x.address+' '+x.phone).toLowerCase().includes(q));$('#mount').innerHTML=layout('Diretório local',`${d.length} registros. Confirme dados antes de deslocamento.`,`<button onclick="setView('home')">Início</button>`)+`<div class="tablewrap"><table class="table"><thead><tr><th>Unidade</th><th>Endereço</th><th>Telefone</th><th></th></tr></thead><tbody>${d.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.address)}</td><td>${esc(x.phone)}</td><td><button onclick='copyText(${JSON.stringify(x.address+' · '+x.phone)})'>Copiar</button></td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:12px">Os dados de Palmas vêm de documentos oficiais encontrados na Prefeitura. A própria rede informa alterações temporárias em algumas unidades; portanto, use a ficha como referência e confirme no canal oficial antes do atendimento.</div>`}
function importer(){$('#mount').innerHTML=layout('Importar / exportar','Traga e leve conteúdos sem depender de servidor.',`<button onclick="backupJSON()">Exportar JSON</button><button onclick="exportMarkdown()">Exportar MD</button><button class="primary" onclick="exportSnapshot()">Exportar HTML</button>`)+`<div class="grid g2"><div class="card"><h3>Importar JSON</h3><input id="jsonFile" type="file" accept="application/json,.json"><div class="muted" style="margin:8px 0">Aceita um backup do próprio sistema. O conteúdo importado é mesclado.</div><button onclick="importJSON()">Importar</button></div><div class="card"><h3>Importar Markdown / texto</h3><input id="textFile" type="file" accept="text/*,.md,.markdown"><div class="muted" style="margin:8px 0">Cada arquivo entra como uma nota, preservando o texto.</div><button onclick="importText()">Importar</button></div></div><div class="card" style="margin-top:13px"><h3>Snapshot compartilhável</h3><div class="notice">Exportar HTML cria uma cópia independente contendo o banco embutido e os seus registros locais atuais. É o método mais simples para compartilhar uma versão específica do banco.</div></div>`}
function importJSON(){const f=$('#jsonFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state={...state,notes:[...state.notes,...(x.notes||[])],tasks:[...state.tasks,...(x.tasks||[])],custom:[...state.custom,...(x.custom||[])],favorites:[...new Set([...state.favorites,...(x.favorites||[])]) ]};save();notify('JSON importado.');render()}catch(e){notify('JSON inválido.')}};r.readAsText(f)}
function importText(){const f=$('#textFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.notes.push({id:uid(),title:f.name,body:r.result,tags:['importado'],created:now()});save();notify('Texto importado como nota.');notes()};r.readAsText(f)}
function backupJSON(){const data={version:APP.version,app:APP.id,exportedAt:now(),...state};downloadBlob(JSON.stringify(data,null,2),'application/json',APP.id+'-backup.json')}
function exportMarkdown(){let md=`# ${APP.title}\n\n${APP.subtitle}\n\n## Notas\n`;for(const n of state.notes)md+=`\n### ${n.title||'Sem título'}\n\n${n.body}\n`;md+='\n## Tarefas\n';for(const t of state.tasks)md+=`- [${t.done?'x':' '}] ${t.title} — ${t.area||''}\n`;downloadBlob(md,'text/markdown',APP.id+'-snapshot.md')}
function exportSnapshot(){const db={...state};const source=document.documentElement.outerHTML.replace(/const BOOT_DATA = .*?;\n/,'const BOOT_DATA = '+JSON.stringify(db)+';\n');downloadBlob('<!doctype html>'+source,'text/html',APP.id+'-snapshot.html')}
function downloadBlob(data,type,name){const blob=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openCardEditor(){modal(`<div class="modalhead"><h3>Adicionar conhecimento</h3><button onclick="closeModal()">Fechar</button></div><div class="field"><label>Título</label><input id="cxTitle"></div><div class="field"><label>Categoria</label><input id="cxCat"></div><div class="field"><label>Conteúdo</label><textarea id="cxBody"></textarea></div><div class="field"><label>Tags</label><input id="cxTags"></div><button class="primary" onclick="saveCardCustom()">Salvar</button>`) }
function saveCardCustom(){let x={id:'custom-'+uid(),title:$('#cxTitle').value.trim(),category:$('#cxCat').value.trim()||'Personalizado',body:$('#cxBody').value.trim(),tags:$('#cxTags').value.split(',').map(s=>s.trim()).filter(Boolean),level:'personalizado',lang:'pt'};if(!x.title||!x.body)return notify('Preencha título e conteúdo.');state.custom.push(x);save();closeModal();knowledge();notify('Conhecimento adicionado.')}
function modal(inner){$('#modalbox').innerHTML=inner;$('#modal').classList.add('open')};function closeModal(){$('#modal').classList.remove('open')}
function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();renderView('knowledge');updateCounts()}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>notify('Copiado.')).catch(()=>notify('Não foi possível copiar automaticamente.'))}
function speak(text){if(!('speechSynthesis'in window))return notify('Síntese de voz indisponível neste navegador.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).slice(0,6000));u.lang=APP.voice||'pt-BR';speechSynthesis.speak(u)}
function promptStudio(){let goal='',rules='';$('#mount').innerHTML=layout('Prompt Studio','Transforme uma intenção em uma tarefa de alta qualidade.',`<button class="primary" onclick="makePrompt()">Gerar</button>`)+`<div class="split"><div class="card"><div class="field"><label>Objetivo</label><input id="pGoal" placeholder="O que precisa ser produzido ou analisado?"></div><div class="field"><label>Contexto</label><textarea id="pContext" placeholder="Informações, público, materiais disponíveis..."></textarea></div><div class="field"><label>Restrições</label><input id="pRules" placeholder="formato, extensão, limites, critérios"></div><div class="field"><label>Idioma</label><select id="pLang"><option>Português</option><option>English</option><option>Español</option><option>Français</option><option>Deutsch</option><option>Italiano</option><option>日本語</option><option>中文</option><option>العربية</option><option>Русский</option></select></div></div><div class="card"><h3>Saída</h3><textarea id="pOut" class="code prompt-preview"></textarea><button onclick="copyText($('#pOut').value)">Copiar prompt</button></div></div>`}

<script>
/* ULTRA OS V6 HARDENING LAYER — generated locally. */
(()=>{
  const V6_ID = 'ultra-local-v6-' + (APP.id || 'app');
  const V6_DB = 'UltraLocalDB_V6';
  const V6_STORE = 'records';
  const V6_ATTACH = 'attachments';
  const V6_META = 'meta';
  const V6_SNAPSHOT = 'snapshots';
  const V6_LEGACY = (typeof KEY==='string' ? KEY : 'LOCAL_ULTRA_OS_V3_'+APP.id);
  const EXTRA = [["Música", "Estrutura de canção", "Uma canção forte administra expectativa, repetição e contraste. Mapeie motivo, verso, pré-refrão, refrão, ponte e clímax antes de adicionar camadas.", "pt-BR", "arranjo,composição"], ["Música", "Melodia e contorno", "O contorno melódico pode organizar tensão e repouso. Analise direção, alcance, notas estruturais e pontos de respiração antes de ornamentar.", "pt-BR", "melodia,composição"], ["Música", "Ritmo e subdivisão", "Treine subdivisões verbalmente e corporalmente antes de acelerar. Precisão nasce da percepção do pulso, não apenas do metrônomo.", "pt-BR", "ritmo,técnica"], ["Música", "Dinâmica vocal", "Interprete intensidade por frase, apoio e articulação. Evite confundir volume com expressão; contraste também pode vir do timbre e da duração.", "pt-BR", "voz,performance"], ["Música", "Afinação vocal", "Use referências externas como ponto de partida, mas desenvolva percepção interna de intervalos, centro tonal e tendência de notas.", "pt-BR", "voz,estudo"], ["Guitarra", "Regulagem básica", "Altura, entonação, alívio do braço e condição de trastes afetam tocabilidade. Registre medições e mudanças para conseguir reverter ajustes.", "pt-BR", "guitarra,setup"], ["Guitarra", "Escala maior aplicada", "Em vez de memorizar desenhos isolados, conecte graus, notas-alvo e intervalos. O objetivo é transformar mapa visual em linguagem musical.", "pt-BR", "guitarra,teoria"], ["Guitarra", "Arpejos e chord tones", "Arpejos revelam a estrutura interna do acorde e funcionam como alvos melódicos. Pratique resolução em terças e sétimas.", "pt-BR", "guitarra,harmonia"], ["Guitarra", "Captadores e espectro", "O resultado de um captador depende de construção, posição, carga elétrica, circuito e cadeia posterior. Compare sempre dentro de um mesmo nível de ganho.", "pt-BR", "guitarra,eletrônica"], ["Guitarra", "Pedalboard e ruído", "Organize alimentação, cabos e ganho antes de culpar um pedal. Ruído pode surgir de aterramento, fontes, loops, cabos ou ganho excessivo.", "pt-BR", "pedais,áudio"], ["Áudio", "Latência e buffer", "Buffer menor tende a reduzir latência de monitoramento, mas aumenta demanda de CPU. O ponto ideal depende de projeto, sessão e estabilidade do sistema.", "pt-BR", "latência,DAW"], ["Áudio", "Headroom digital", "Evite níveis próximos ao limite em toda a cadeia. Headroom é espaço para transientes e para decisões posteriores de processamento.", "pt-BR", "mixagem,ganho"], ["Áudio", "Roteamento de sinal", "Desenhe a cadeia de entrada, processamento, monitoramento e saída antes de conectar equipamentos. Um diagrama simples economiza tempo de diagnóstico.", "pt-BR", "roteamento,studio"], ["Áudio", "Monitoração crítica", "Avalie decisões em mais de um sistema de reprodução. Compare volume, espectro, panorama, inteligibilidade e tradução.", "pt-BR", "mixagem,monitoramento"], ["Áudio", "Mixagem por referência", "Uma referência útil deve ser comparada em nível percebido semelhante e com objetivo explícito. Não copie curvas; copie decisões justificadas.", "pt-BR", "mixagem,referência"], ["Áudio", "EQ corretivo", "Antes de cortar ou aumentar, identifique o problema no contexto da mixagem. EQ isolado pode criar uma solução que desaparece quando o arranjo completo volta.", "pt-BR", "EQ,mixagem"], ["Áudio", "Compressão", "Compressão modifica dinâmica e pode alterar envelope, densidade e percepção de proximidade. Ajuste ataque e release ouvindo a intenção musical.", "pt-BR", "compressão,mixagem"], ["Áudio", "Automação", "Automação é parte da mixagem, não remendo. Use volume, panorama, sends e parâmetros para acompanhar a narrativa da música.", "pt-BR", "automação,mixagem"], ["Home Studio", "Acústica primeiro", "No home studio, posição das caixas, simetria e tratamento das primeiras reflexões podem gerar mais retorno do que trocar plugins repetidamente.", "pt-BR", "acústica,studio"], ["Home Studio", "Cadeia de gravação", "Documente instrumento → cabos → pré/DI/interface → DAW → monitoramento. Quanto menos ambígua a cadeia, mais rápido o diagnóstico.", "pt-BR", "gravação,workflow"], ["Tecnologia", "Arquitetura local-first", "Dados críticos devem existir no dispositivo e ter exportação explícita. O sistema pode funcionar offline e sincronizar somente quando o usuário escolher.", "pt-BR", "software,arquitetura"], ["Tecnologia", "IndexedDB", "IndexedDB é apropriado para grandes quantidades de dados estruturados e permite índices para consultas rápidas no navegador.", "pt-BR", "web,banco"], ["Tecnologia", "Cache em memória", "Use memória em RAM para leitura rápida e um banco persistente para durabilidade. O cache não deve ser tratado como fonte única de verdade.", "pt-BR", "performance,cache"], ["Tecnologia", "Renderização incremental", "Atualize apenas o componente que mudou. Reconstruir toda a interface a cada tecla é uma fonte comum de trabalho desnecessário.", "pt-BR", "frontend,performance"], ["Tecnologia", "Virtualização", "Listas grandes devem renderizar somente itens visíveis. Isso mantém DOM e custo de layout sob controle mesmo com milhares de registros.", "pt-BR", "frontend,performance"], ["Tecnologia", "Web Worker", "Tarefas CPU-intensivas, como indexação ou análise de grandes coleções, podem migrar para Web Workers para evitar travar a interface.", "pt-BR", "javascript,worker"], ["Estudo", "Recuperação ativa", "Feche a fonte e tente explicar a ideia de memória. A dificuldade de recuperar informação é parte do mecanismo de aprendizagem.", "pt-BR", "estudo,memória"], ["Estudo", "Repetição espaçada", "Distribua revisões ao longo do tempo e aumente o intervalo conforme a lembrança se mantém.", "pt-BR", "estudo,revisão"], ["Estudo", "Interleaving", "Misturar tópicos relacionados pode melhorar discriminação e transferência, especialmente quando os exercícios exigem escolher o método adequado.", "pt-BR", "estudo,aprendizagem"], ["Produtividade", "Regra do próximo movimento", "Um projeto deve sempre ter um próximo movimento observável. Se a próxima ação é abstrata, o projeto ainda não está operacionalizado.", "pt-BR", "projetos,execução"], ["Produtividade", "Revisão semanal", "Faça uma revisão de compromissos, projetos, pendências e ideias antes de iniciar uma nova semana.", "pt-BR", "rotina,planejamento"], ["IA", "Prompt verificável", "Um bom prompt informa objetivo, contexto, restrições, formato, critérios de qualidade e tratamento de incerteza.", "pt-BR", "IA,prompt"], ["IA", "Pesquisa com fontes", "Separe fatos, inferências e lacunas. Informações sensíveis ao tempo precisam de fonte atual e data de verificação.", "pt-BR", "IA,pesquisa"], ["Música", "Song structure", "Strong songs manage expectation through repetition, contrast and release. Map motifs and sections before adding layers.", "en", "music,arrangement"], ["Áudio", "Gain staging", "Manage level at every stage of the chain. Do not use one extreme cut to compensate for an upstream level problem.", "en", "audio,gain"], ["Tecnologia", "Offline-first", "Design critical workflows to remain useful without network access, then make synchronization an optional layer.", "en", "software,offline"], ["Estudo", "Active recall", "Retrieval attempts strengthen access to knowledge. Ask yourself questions before rereading the answer.", "en", "learning,memory"]];
  let v6db = null;
  let v6SaveTimer = null;
  let v6Channel = null;
  let v6SearchIndex = null;
  let v6Ready = false;

  const v6safe = (v, fallback) => (v === undefined || v === null) ? fallback : v;
  const v6clone = (x) => { try { return structuredClone(x); } catch { return JSON.parse(JSON.stringify(x)); } };
  const v6key = (type,id) => type+'::'+id;

  function v6Open() {
    if(v6db) return Promise.resolve(v6db);
    if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB indisponível'));
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(V6_DB,1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(V6_STORE)){
          const st=db.createObjectStore(V6_STORE,{keyPath:'pk'});
          st.createIndex('type','type');
          st.createIndex('updatedAt','updatedAt');
        }
        if(!db.objectStoreNames.contains(V6_ATTACH)){db.createObjectStore(V6_ATTACH,{keyPath:'id'});}
        if(!db.objectStoreNames.contains(V6_META)){db.createObjectStore(V6_META,{keyPath:'id'});}
        if(!db.objectStoreNames.contains(V6_SNAPSHOT)){db.createObjectStore(V6_SNAPSHOT,{keyPath:'id'});}
      };
      req.onsuccess=()=>{v6db=req.result; v6db.onversionchange=()=>v6db.close(); resolve(v6db)};
      req.onerror=()=>reject(req.error||new Error('Falha ao abrir IndexedDB'));
    });
  }

  const v6tx=(store,mode='readonly')=>v6Open().then(db=>db.transaction(store,mode).objectStore(store));

  async function v6GetAll() {
    const st=await v6tx(V6_STORE);
    return new Promise((resolve,reject)=>{const r=st.getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
  }
  async function v6PutAll(records) {
    const db=await v6Open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(V6_STORE,'readwrite'), st=tx.objectStore(V6_STORE);
      records.forEach(r=>st.put(r));
      tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error||new Error('Falha na gravação'));
    });
  }
  async function v6ClearAndPut(records) {
    const db=await v6Open();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(V6_STORE,'readwrite'), st=tx.objectStore(V6_STORE);
      st.clear(); records.forEach(r=>st.put(r));
      tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error||new Error('Falha na reconstrução do índice'));
    });
  }
  async function v6PutAttachment(file) {
    const db=await v6Open();
    const rec={id:uid(),name:file.name,type:file.type||'application/octet-stream',size:file.size,createdAt:now(),blob:file};
    return new Promise((resolve,reject)=>{const tx=db.transaction(V6_ATTACH,'readwrite');tx.objectStore(V6_ATTACH).put(rec);tx.oncomplete=()=>resolve(rec);tx.onerror=()=>reject(tx.error)});
  }
  async function v6GetAttachments() {
    const st=await v6tx(V6_ATTACH); return new Promise((resolve,reject)=>{const r=st.getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)});
  }

  function v6StateRecords() {
    const keys=['notes','tasks','projects','favorites','recent','custom','history','flash','settings'];
    return keys.map(type=>({pk:v6key('state',type),type:'state',id:type,data:v6clone(state[type]),updatedAt:Date.now()}));
  }
  async function v6PersistSnapshot() {
    const records=v6StateRecords();
    await v6ClearAndPut(records);
    const db=await v6Open();
    await new Promise((resolve,reject)=>{const tx=db.transaction(V6_META,'readwrite');tx.objectStore(V6_META).put({id:'app',version:'6',updatedAt:Date.now(),app:APP.id});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
    v6Ready=true;
  }
  async function v6ReadState() {
    const rows=await v6GetAll();
    if(!rows.length) return null;
    const next={...state};
    for(const r of rows) if(r.type==='state') next[r.id]=r.data;
    return next;
  }

  function v6Merge(next) {
    if(!next || typeof next!=='object') return;
    state={...state,...next,settings:{...state.settings,...(next.settings||{})}};
    for(const k of ['notes','tasks','projects','favorites','recent','custom','history']) if(!Array.isArray(state[k])) state[k]=[];
    if(typeof state.flash!=='number') state.flash=0;
  }

  async function v6MigrateLegacy() {
    let old=null;
    try{const raw=localStorage.getItem(V6_LEGACY); if(raw) old=JSON.parse(raw)}catch{}
    if(!old){
      try{await idbOpen(); const legacy=await idbGet(); if(legacy) old=legacy}catch{}
    }
    if(old) v6Merge(old);
    // Guarantee useful fresh defaults without overwriting user content.
    if(!state.tasks.length) state.tasks=[{id:uid(),title:'Definir a prioridade principal',area:'Foco',done:false,created:now()}];
    if(!Array.isArray(state.custom)) state.custom=[];
    for(const x of EXTRA){
      const id='v6-'+persona+'-'+btoa(unescape(encodeURIComponent(x[0]+'|'+x[1]))).replace(/=/g,'').slice(0,22);
      if(!state.custom.some(c=>c.id===id)) state.custom.push({id,title:x[1],category:x[0],body:x[2],lang:x[3],tags:x[4].split(',')});
    }
  }

  function v6BuildIndex() {
    const map=new Map();
    const add=(obj,id)=>{for(const token of String(obj||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(Boolean)){if(token.length<2)continue;const set=map.get(token)||new Set();set.add(id);map.set(token,set)}};
    (built?.cards||[]).forEach(c=>add([c.title,c.body,c.category,(c.tags||[]).join(' ')].join(' '),c.id));
    (state.custom||[]).forEach(c=>add([c.title,c.body,c.category,(c.tags||[]).join(' ')].join(' '),c.id));
    (state.notes||[]).forEach(c=>add([c.title,c.body,(c.tags||[]).join(' ')].join(' '),c.id));
    v6SearchIndex=map;
  }
  function v6Search(q) {
    const tokens=String(q||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(Boolean);
    if(!tokens.length) return [];
    const counts=new Map();
    for(const t of tokens) for(const id of (v6SearchIndex?.get(t)||[])) counts.set(id,(counts.get(id)||0)+1);
    return [...counts.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  }

  async function v6Save() {
    try{ localStorage.setItem(V6_ID,JSON.stringify(state)); }catch{}
    clearTimeout(v6SaveTimer);
    v6SaveTimer=setTimeout(()=>v6PersistSnapshot().catch(()=>{}),180);
    try{v6Channel?.postMessage({type:'sync',app:APP.id,at:Date.now()})}catch{}
  }
  async function v6Load() {
    try{
      const fresh=await v6ReadState();
      if(fresh) v6Merge(fresh); else await v6MigrateLegacy();
      await v6PersistSnapshot();
    }catch{
      await v6MigrateLegacy();
    }
    v6BuildIndex(); v6Ready=true;
    applyTheme(); updateCounts(); render();
  }

  function v6Install() {
    document.documentElement.classList.add('v6-enhanced');
    document.title=APP.title+' — V6';
    try{v6Channel=('BroadcastChannel' in window)?new BroadcastChannel('UltraLocalOS-V6-'+APP.id):null;
      v6Channel?.addEventListener('message',async e=>{if(e.data?.type==='sync'&&e.data.app===APP.id){const f=await v6ReadState().catch(()=>null);if(f){v6Merge(f);v6BuildIndex();render();}}});
    }catch{}
    const navWrap=document.querySelector('.nav');
    if(navWrap){
      if(!document.querySelector('[data-nav="library"]')) navWrap.insertAdjacentHTML('beforeend',`<button data-nav="library" onclick="setView(\'library\')"><span>▣</span><span class="label">Biblioteca</span></button>`);
      if(!document.querySelector('[data-nav="diagnostics"]')) navWrap.insertAdjacentHTML('beforeend',`<button data-nav="diagnostics" onclick="setView(\'diagnostics\')"><span>✓</span><span class="label">Diagnóstico</span></button>`);
    }
    // Stronger navigation: preserve query in hash and restore browser back/forward.
    const baseSetView=setView;
    window.setView=function(name){location.hash=name; baseSetView(name);};
    window.addEventListener('hashchange',()=>{const n=currentView(); if(n==='library'||n==='diagnostics') renderView(n);});
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch')?.focus();$('#globalSearch')?.select();} if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();v6Save();notify('Banco persistido localmente.')}});
    // Attachments importer.
    window.v6ImportFiles=async function(input){const files=[...(input?.files||[])]; if(!files.length)return; let n=0; for(const f of files){try{await v6PutAttachment(f);n++;}catch{}} notify(n+' arquivo(s) armazenado(s) localmente.'); if(currentView()==='library') renderView('library');};
    window.v6DeleteAttachment=async function(id){const db=await v6Open();await new Promise((resolve,reject)=>{const tx=db.transaction(V6_ATTACH,'readwrite');tx.objectStore(V6_ATTACH).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});renderView('library');};
  }

  const persona = 'jp';
  // expose diagnostics without polluting the application surface
  window.__ULTRA_V6__={id:V6_ID,db:V6_DB,ready:()=>v6Ready,save:v6Save,load:v6Load,search:v6Search,getAttachments:v6GetAttachments};
  v6Install();
  // Rebind the global save/load entry points used by existing V5 UI functions.
  window.save=v6Save; window.load=v6Load;
  // Replace the renderer dispatcher only for new V6 pages; keep the mature V5 views untouched.
  const oldRenderView=window.renderView;
  window.renderView=function(name){
    if(name==='library') return v6Library();
    if(name==='diagnostics') return v6Diagnostics();
    return oldRenderView(name);
  };
  function v6Library(){
    Promise.resolve(v6GetAttachments()).then(items=>{
      $('#mount').innerHTML=layout('Biblioteca local','Arquivos anexados ao banco do aplicativo.',`<input id="v6files" type="file" multiple onchange="v6ImportFiles(this)" style="max-width:260px"><button onclick="backupJSON()">Exportar JSON</button>`)+`<div class="notice">Os arquivos desta biblioteca ficam associados à origem do aplicativo. Exporte snapshots/JSON antes de limpar os dados do navegador.</div><div class="grid g2" style="margin-top:13px">${items.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><div class="muted">${esc(x.type)} · ${Math.round(x.size/1024)} KB</div><div class="actions" style="margin-top:10px"><button onclick="v6DeleteAttachment('${x.id}')">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum arquivo local.</div>'}</div>`;
    });
  }
